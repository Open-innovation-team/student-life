version: 2.1

orbs:
  node: circleci/node@5.2.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  block-dev-to-main:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Block Dev to Main
          command: |
            PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | grep -o '[0-9]*$')

            echo "PR Number: $PR_NUMBER"

            if [ -z "$PR_NUMBER" ]; then
              echo "Pas de PR détectée, skip"
              exit 0
            fi

            PR_DATA=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open")

            SOURCE_BRANCH=$(echo "$PR_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['head']['ref']) if d else print('')")
            TARGET_BRANCH=$(echo "$PR_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['base']['ref']) if d else print('')")

            echo "Source branch: $SOURCE_BRANCH"
            echo "Target branch: $TARGET_BRANCH"

            # Règles vers main : seulement release/* et hotfix/*
            if [ "$TARGET_BRANCH" = "main" ]; then
              if ! echo "$SOURCE_BRANCH" | grep -qE '^(release|hotfix)/'; then
                echo "Seules les branches release/* et hotfix/* peuvent etre merge dans main !"
                exit 1
              fi
            fi

            # Règles vers integration : seulement develop et hotfix/*
            if [ "$TARGET_BRANCH" = "integration" ]; then
              if [ "$SOURCE_BRANCH" != "develop" ] && ! echo "$SOURCE_BRANCH" | grep -qE '^hotfix/'; then
                echo "Seules develop et hotfix/* peuvent etre merge dans integration !"
                exit 1
              fi
            fi

            echo "OK"

  test-api:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build API
          command: npx turbo run build --filter=@student-life/api
      - run:
          name: Tests API
          command: npx turbo run test --filter=@student-life/api

  test-web:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build Web
          command: npx turbo run build --filter=@student-life/web
      - run:
          name: Tests Web
          command: npx turbo run test --filter=@student-life/web

  test-mobile:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Tests Mobile
          command: npx turbo run test --filter=@student-life/mobile

  security-scan:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Audit des dépendances (échec si high/critical)
          command: npm audit --audit-level=high
      - run:
          name: Scan de secrets (gitleaks)
          command: |
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
              | tar -xz gitleaks
            ./gitleaks detect --source . --no-banner --redact

  sonarqube:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      # (optionnel mais recommandé : build + tests avec couverture
      #  pour que Sonar récupère la coverage des packages)
      - run:
          name: Déterminer branche vs PR pour Sonar
          command: |
            # On cherche une PR ouverte dont la source = la branche courante
            PR_DATA=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open")
            PR_NUMBER=$(echo "$PR_DATA" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['number'] if d else '')")
            BASE_BRANCH=$(echo "$PR_DATA" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['base']['ref'] if d else '')")

            if [ -n "$PR_NUMBER" ]; then
              echo "Analyse PR #$PR_NUMBER ($CIRCLE_BRANCH -> $BASE_BRANCH)"
              {
                echo "sonar.pullrequest.key=$PR_NUMBER"
                echo "sonar.pullrequest.branch=$CIRCLE_BRANCH"
                echo "sonar.pullrequest.base=$BASE_BRANCH"
              } >> sonar-project.properties
            else
              echo "Analyse de branche : $CIRCLE_BRANCH"
              echo "sonar.branch.name=$CIRCLE_BRANCH" >> sonar-project.properties
            fi
      - sonarcloud/scan

workflows:
  ci:
    jobs:
      - block-dev-to-main
      - test-api
      - test-web
      - test-mobile
      - security-scan
      - sonarqube
