sonar.organization=open-innovation-team
sonar.projectKey=open-innovation-team

# Monorepo : on scanne les apps, on exclut le reste
sonar.sources=apps
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/*.test.ts,**/*.spec.ts

# Si tu génères de la couverture (lcov) :
# sonar.javascript.lcov.reportPaths=apps/backend/api/coverage/lcov.info,apps/web/coverage/lcov.info

# Bloque la CI tant que le Quality Gate n'est pas au vert : le scanner attend
# le verdict de SonarCloud et sort en erreur si le gate échoue (nouvelles issues,
# couverture insuffisante, etc.). Combiné à une "required check" GitHub, ça
# empêche le merge tant que Sonar n'est pas vert.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
